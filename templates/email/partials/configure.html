<h2 style="margin:24px 0 8px;font-family:${font_display};font-size:15px;font-weight:700;color:${color_questgold};">Configure your client</h2>
<p style="margin:0 0 8px;font-family:${font_body};font-size:14px;line-height:1.6;color:${color_parchment};">In your game folder, open <b>Data/&lt;locale&gt;/realmlist.wtf</b> (for example <b>Data/enUS/realmlist.wtf</b>) and set its contents to:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;font-family:${font_body};font-size:14px;line-height:1.6;color:${color_parchment};">
${rows}</table>
<!-- row -->
<tr><td style="padding:2px 12px 2px 0;color:${color_muted};white-space:nowrap;vertical-align:top;">${label}</td><td style="padding:2px 0;font-family:'Courier New',monospace;">${value}</td></tr>
<!-- row:url -->
<tr><td style="padding:2px 12px 2px 0;color:${color_muted};white-space:nowrap;vertical-align:top;">${label}</td><td style="padding:2px 0;"><a href="${url}" style="color:${color_gold_corner};font-weight:700;text-decoration:none;">${value}</a></td></tr>
