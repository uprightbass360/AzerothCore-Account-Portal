name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Tests (100% branch coverage enforced, Python 3.14 per .python-version)
        run: uv run pytest
      - name: Tests on Python 3.12 (docker runtime parity, no coverage)
        run: uv run -p 3.12 --frozen pytest --no-cov -q
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (100% coverage thresholds)
        run: npx vitest run --coverage
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}
      - name: Build backend image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/azerothcore-account-portal-backend:latest
            ${{ secrets.DOCKERHUB_USER }}/azerothcore-account-portal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/azerothcore-account-portal-frontend:latest
            ${{ secrets.DOCKERHUB_USER }}/azerothcore-account-portal-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
